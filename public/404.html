        color: #f8fafc;

      }
      .card {
        max-width: 680px;
        padding: 48px 32px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 24px;
        background: rgba(17,24,39,0.7);
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      }
      h1 { margin: 0 0 16px; font-size: clamp(2.5rem, 4vw, 4rem); }
      p { color: #cbd5e1; line-height: 1.7; }
      a {
        display: inline-block;
        margin-top: 16px;
        color: #fff;
        background: #ff7a00;
        padding: 12px 20px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
      }

    <main class="card">
      <h1>404 - Page not found</h1>
